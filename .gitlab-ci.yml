workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - validate
  - publish

validate:
  stage: validate
  image: node:22.19.0-alpine3.22
  tags:
    - ci-jm
  before_script:
    - apk add --no-cache bash git
  script:
    - HUSKY=0 npm ci
    - npm run check
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        package_version="$(node -p 'require("./package.json").version')"
        test "$CI_COMMIT_TAG" = "v${package_version}"
      fi

publish_image:
  stage: publish
  resource_group: publish-image-$CI_COMMIT_SHORT_SHA
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  tags:
    - ci-jm
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -eu
      image="$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
      manifest_error="$(mktemp)"
      trap 'rm -f "$manifest_error"' EXIT

      if docker manifest inspect "$image" > /dev/null 2> "$manifest_error"; then
        echo "Reusing existing image $image"
        docker pull "$image"
        remote_revision="$(docker image inspect \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
          "$image")"
        if [ "$remote_revision" != "$CI_COMMIT_SHA" ]; then
          echo "Existing image revision '$remote_revision' does not match '$CI_COMMIT_SHA'." >&2
          exit 1
        fi
      elif grep -Eiq '(no such manifest|manifest unknown)' "$manifest_error"; then
        echo "Image $image does not exist; building it from $CI_COMMIT_SHA"
        docker build --pull \
          --build-arg OCI_SOURCE="$CI_PROJECT_URL" \
          --build-arg OCI_REVISION="$CI_COMMIT_SHA" \
          --tag "$image" .
        docker push "$image"
      else
        echo "Could not determine whether $image exists:" >&2
        cat "$manifest_error" >&2
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

